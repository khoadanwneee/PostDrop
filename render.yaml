services:
  # 1. Frontend (Next.js Web Service - Free)
  - type: web
    name: postdrop-frontend
    env: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: postdrop-backend-api
          property: host

  # 2. Backend API + Integrated Worker (NestJS Web Service - Free)
  - type: web
    name: postdrop-backend-api
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: LETTER_ENCRYPTION_KEY
        sync: false
      - key: REVEAL_TOKEN_SECRET
        sync: false
      - key: PUBLIC_APP_URL
        fromService:
          type: web
          name: postdrop-frontend
          property: host
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
